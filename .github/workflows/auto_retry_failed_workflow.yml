name: Auto Retry Failed Workflows

# Watches the workflows listed below and, when one of them fails, automatically
# re-runs its failed jobs. A run is re-tried until it has been attempted
# MAX_ATTEMPTS times (see the env var below), after which it is left to fail.

on:
  workflow_run:
    workflows:
      - "Windows BinSkim Security Analysis PR Check"
      - "Windows Build Tests on Aie-rt PR Check."
      - "Keyword Scan"
      - "Coverity Tests on Aie-rt PR Check."
      - "Update copyrights headers and disclaimers"
      - "Code Scan Build Analysis PR Check"
      - "Transaction binary Validation PR Check"
      - "Aie-rt Build failures Validation PR Check"
      - "Build Tests on Aie-rt Fal PR Check."
      - "Aig ControlCode Validation PR Check"
      - "AIE4_MEDUSA Tests Validation On memsimulator PR Check."
    types:
      - completed

permissions:
  actions: write

env:
  # Maximum number of run attempts allowed (initial attempt + retries).
  # run_attempt < MAX_ATTEMPTS means the run may still be re-tried.
  MAX_ATTEMPTS: 3

jobs:
  rerun-on-failure:
    # NOTE: the job-level `if:` cannot reference the `env` context (only github,
    # needs, vars and inputs are available here), so the MAX_ATTEMPTS check is
    # done in the step-level `if:` below, where `env` is available.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, linux, x64, jenkins-linux-runner]
    steps:
      - name: Re-run failed jobs
        if: ${{ github.event.workflow_run.run_attempt < fromJSON(env.MAX_ATTEMPTS) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="${{ github.event.workflow_run.id }}"
          attempt="${{ github.event.workflow_run.run_attempt }}"
          name="${{ github.event.workflow_run.name }}"
          api="${{ github.api_url }}"
          repo="${{ github.repository }}"

          echo "Workflow '$name' failed on attempt $attempt (run_id=$run_id)."
          echo "Requesting re-run of failed jobs..."

          http_code=$(curl -sSL -o /tmp/rerun_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/repos/$repo/actions/runs/$run_id/rerun-failed-jobs")

          echo "API response (HTTP $http_code):"
          cat /tmp/rerun_response.json || true
          echo

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Re-run triggered for '$name' (will be attempt $((attempt + 1)))."
          else
            echo "❌ Failed to trigger re-run for '$name' (HTTP $http_code)."
            exit 1
          fi
